name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build distZip distTar --no-daemon

      - name: Rename archives with the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/distributions
          mv git-repo-historian.zip "git-repo-historian-${VERSION}.zip"
          mv git-repo-historian.tar "git-repo-historian-${VERSION}.tar"
          gzip -f "git-repo-historian-${VERSION}.tar"
          shasum -a 256 git-repo-historian-* > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/distributions/git-repo-historian-*.zip
            build/distributions/git-repo-historian-*.tar.gz
            build/distributions/checksums.txt
